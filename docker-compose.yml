services:
  db:
    image: postgres:16-alpine
    container_name: tasknova-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasknova_user
      POSTGRES_PASSWORD: tasknova_pass
      POSTGRES_DB: tasknova
    ports:
      - "5432:5432"
    volumes:
      - tasknova_pgdata:/var/lib/postgresql/data

volumes:
  tasknova_pgdata:
